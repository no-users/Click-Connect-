<!doctype html><html lang="hi"><head><meta charset="utf-8"><title>Click & Continue</title>
<style>
:root{--bg:#0b1220;--card:#121b2e;--line:#22304d;--tx:#e8edf7;--mut:#8a98b8;--gold:#f5b942;--acc:#4f8cff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden;-webkit-user-select:none}
.top{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:10px;padding:0 150px 0 14px;border-bottom:1px solid var(--line);background:var(--bg);-webkit-app-region:drag}
.top>*{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:10px;-webkit-app-region:drag}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#e08a1e);display:grid;place-items:center;color:#0b1220;font-style:normal;font-weight:800}
.ib{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-size:16px;cursor:pointer}
.ib:hover{background:var(--card);color:var(--tx)}
.url{flex:1;max-width:640px;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--tx);padding:0 16px;outline:none}
.url:focus{border-color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;background:#35d07f}.dot.load{background:var(--gold);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.side{position:fixed;top:56px;bottom:0;left:0;width:72px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px}
.nb{width:52px;padding:8px 0;border:0;border-radius:12px;background:transparent;color:var(--mut);cursor:pointer;font-size:20px}
.nb small{display:block;font-size:10px;margin-top:2px}
.nb:hover{background:var(--card);color:var(--tx)}.nb.on{background:var(--card);color:var(--gold)}
</style></head><body>
<div class="top">
  <div class="brand"><i>C</i>Click &amp; Continue</div>
  <button class="ib" title="Back" onclick="shell.nav('back')">‹</button>
  <button class="ib" title="Forward" onclick="shell.nav('forward')">›</button>
  <button class="ib" title="Reload" onclick="shell.nav('reload')">⟳</button>
  <input id="u" class="url" spellcheck="false" onkeydown="if(event.key==='Enter')shell.nav('go',this.value)">
  <span id="d" class="dot"></span>
</div>
<div class="side">
  <button class="nb" onclick="shell.nav('home')">⌂<small>Home</small></button>
  <button class="nb" data-m="app" onclick="shell.mode('app')">▦<small>Software</small></button>
  <button class="nb" data-m="portal" onclick="shell.mode('portal')">🌐<small>Portal</small></button>
  <button class="nb" data-m="split" onclick="shell.mode('split')">◫<small>Dono</small></button>
</div>
<script>
const u=document.getElementById('u'),d=document.getElementById('d'),
shell.onMode(m=>document.querySelectorAll('.nb[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m)));
shell.onUrl((x,l)=>{if(document.activeElement!==u)u.value=x;d.classList.toggle('load',l)});
</script></body></html>
